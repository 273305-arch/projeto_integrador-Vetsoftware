<p>Nome: {{ nome }}</p><br>
<label>Preço: </label><br>
<input type="text" [(ngModel)]="preco" (ngModelChange)="calcularTotal()"><br><br>
<label>Quantidade: </label><br>
<input type="text" [(ngModel)]="quantidade" (ngModelChange)="calcularTotal()"><br><br>


<p>Produto: {{ nome }}</p>
<p>Preço: {{ preco | currency:'BRL': 'symbol':'1.2-2'}}</p>
<p>Quantidade: {{ quantidade }}</p>
<p>Total: {{ total | currency:'BRL': 'symbol':'1.2-2'}}</p>
