<p>PRODUTO: {{ nomeProduto }}</p>
<p>QUANTIDADE DO PRODUTO: {{ quantidadeEstoque }}</p>
<p *ngIf="quantidadeEstoque > 0">
    Produto Disponivel
</p>
<p *ngIf="quantidadeEstoque === 0">
    Produto sem estoque
</p>

<button (click)="removerUnidade()" [disabled]="quantidadeEstoque === 0">- Disminuir</button>
<button (click)="aumentarUnidade()">+ Aumentar</button>
