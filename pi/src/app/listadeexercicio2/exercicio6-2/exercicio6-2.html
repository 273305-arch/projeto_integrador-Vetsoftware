<p>NOMES CADASTRADOS: {{ nomes.length }}</p>
<button (click)="removerUltimo()">Remover ultimo da Lista</button>
<button (click)="limparLista()">Limpar a lista toda</button>
<button (click)="restaurarLista()">Restaurar conteúdo da lista</button>

<div *ngIf="nomes.length > 0 else listaVazia">
    <ul>
        <li *ngFor="let nome of nomes">
            {{ nomes }}
        </li>
    </ul>
</div>

<ng-template #listaVazia>
    <p>Não há contéudo na lista</p>
</ng-template>
