<ul>
    <li *ngFor="let nome of nomes; let i = index; let isFirst = first; let isLast = last">
        {{ i + 1 }} . {{ nomes }}
        <span *ngIf="isFirst">
            (primeiro da lista)
        </span>
        <span *ngIf=""isLast>
            (ultimo da lista)
        </span>
    </li>
</ul>
